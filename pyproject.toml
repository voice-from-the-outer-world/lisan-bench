[project]
name = "lisan-bench"
version = "0.2.0"
description = "LisanBench benchmark runner and analysis tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "adjustText>=1.3.0",
    "anthropic==0.75.0",
    "google-genai==1.52.0",
    "matplotlib==3.10.3",
    "networkx==3.5",
    "numpy>=2.0.0,<3.0.0",
    "openai==2.8.1",
    "pandas==2.2.3",
    "python-dotenv==1.1.0",
    "PyYAML==6.0.2",
    "requests==2.32.3",
    "seaborn==0.13.2",
    "tiktoken>=0.12.0",
    "wordfreq>=3.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
